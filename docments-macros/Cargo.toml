[package]
name = "docments-macros"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "The #[docments] attribute; use the docments crate instead"
repository = "https://github.com/AnswerDotAI/docments"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
